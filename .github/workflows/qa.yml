name: Design QA

on:
  push:
    branches: [main, 'redesign/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install QA dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run static and browser QA
        run: npm run qa

      - name: Upload QA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-qa-${{ github.sha }}
          path: qa/
          if-no-files-found: warn
          retention-days: 14
